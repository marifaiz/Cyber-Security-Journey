<!DOCTYPE html>
<html>
<head>
    <title>Scam Message Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Scam Message Detector</h1>
    
        <textarea id="messageInput" rows="6" cols="50" placeholder="Paste your message here..."></textarea>
        <br>
        <button id="checkButton">Check Message</button>

        <h2>Result:</h2>
        <div class="result-box" id="resultOutput"></div>

        <footer>
            <p>Built by Maryam Faisal — <a href="https://github.com/marifaiz" style="color:#F5A623;">GitHub</a></p><p class="disclaimer">This tool flags common warning signs but isn't a guarantee. When in doubt, verify independently before acting.</p>
        </footer>
        <script src="script.js"></script>
    </div>
</body>
</html>
